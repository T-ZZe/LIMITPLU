name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compiler
        run: |
          POM=$(find . -name pom.xml -not -path './.git/*' | head -n 1)
          cd "$(dirname "$POM")"
          mvn -B package
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/CustomMobs-1.0.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: CustomMobs
          path: out/CustomMobs-1.0.jar
